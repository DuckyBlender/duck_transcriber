[package]
name = "duck_transcriber"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4"
reqwest = { version = "0.13", features = [
    "multipart",
    "json",
    "rustls"
], default-features = false }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "process", "fs"] }
teloxide = { version = "0.17", features = ["macros", "rustls", "ctrlc_handler"], default-features = false }
strum = { version = "0.28", features = ["derive"] }
log = "0.4"
fern = "0.7"
dotenvy = "0.15.7"
